services:
  zorqemi-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zorqemi}
      POSTGRES_USER: ${POSTGRES_USER:-zorqemi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - zorqemi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [zorqemi]

  zorqemi-api:
    build:
      context: .
      dockerfile: server/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY must be set}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET must be set}
      INTERNAL_MAINTENANCE_TOKEN: ${INTERNAL_MAINTENANCE_TOKEN:?INTERNAL_MAINTENANCE_TOKEN must be set}
      ALLOW_MERCHANT_REGISTRATION: ${ALLOW_MERCHANT_REGISTRATION:-false}
      ZQ_SMOKE_MODE: ${ZQ_SMOKE_MODE:-false}
      ZQ_PLATFORM_ADMIN_EMAILS: ${ZQ_PLATFORM_ADMIN_EMAILS:-}
      ZORQEMI_ALLOWED_CHECKOUT_ORIGINS: ${ZORQEMI_ALLOWED_CHECKOUT_ORIGINS:-https://zorqemi.de,https://www.zorqemi.de,https://zorqemishop.de,https://www.zorqemishop.de}
      DATABASE_URL: postgresql://${POSTGRES_USER:-zorqemi}:${POSTGRES_PASSWORD}@zorqemi-db:5432/${POSTGRES_DB:-zorqemi}
      DB_POOL_MAX: 10
    depends_on:
      zorqemi-db:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [zorqemi]

  zorqemi-web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      zorqemi-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [zorqemi]

volumes:
  zorqemi-db-data:

networks:
  zorqemi:
    driver: bridge
