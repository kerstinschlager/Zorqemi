server {
  listen 80;
  listen [::]:80;
  # Accept the platform domain, every ZorqemiShop subdomain and custom domains.
  # TLS termination can later be added in the outer reverse proxy / cert manager.
  server_name zorqemi.de www.zorqemi.de zorqemishop.de www.zorqemishop.de *.zorqemishop.de _;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    default_type text/plain;
    return 200 'ok\n';
  }

  # Forward the original Host so the API can resolve the merchant shop.
  location /api/ {
    proxy_pass http://zorqemi-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|gif|ico|json|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
  }
}
