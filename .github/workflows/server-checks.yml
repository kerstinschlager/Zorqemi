name: Zorqemi server checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate API JavaScript
        run: |
          node --check server/api/src/server.js
          node --check server/api/src/checkout-api.js
          node --check server/api/src/auth.js
          node --check server/api/src/shop-router.js
      - name: Validate Docker Compose
        run: docker compose config
      - name: Build API image
        run: docker build -f server/api/Dockerfile .
      - name: Build web image
        run: docker build -t zorqemi-web-check .
